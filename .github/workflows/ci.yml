name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: ${{ github.workspace }}/.superpowers/test-data/ci
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install dashboard dependencies
        run: npm ci --prefix ui
      - name: Production dependency audit
        run: bun audit --production
      - name: Run linter
        run: bun run lint:all
      - name: Run type check
        run: bun run typecheck
      - name: Run dashboard type check
        run: npm run typecheck --prefix ui
      - name: Build dashboard UI
        run: bun run build:ui
      - name: Run unit tests
        # Each file gets a fresh process because several legacy tests mutate the
        # singleton server/config state while exercising alternate deployments.
        run: find tests -maxdepth 1 -name '*.test.ts' -print0 | sort -z | xargs -0 -n1 bun test
      - name: Run integration tests
        if: env.GH_TOKEN != ''
        run: find tests/integration -maxdepth 1 -name '*.test.ts' -print0 | sort -z | xargs -0 -n1 bun test
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Verify public Nginx route compatibility
        run: |
          docker pull nginx:1.29-alpine
          RUN_NGINX_TESTS=1 bun test tests/nginx-public-routes.test.ts
      - name: Build
        run: bun run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v6
      - uses: actions/dependency-review-action@da6b129d277471d01428781accece1bd831a8b0d # v4
        with:
          fail-on-severity: high
