name: Nightly Smoke Tests

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: ${{ github.workspace }}/.superpowers/test-data/nightly
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4 # v6
        with:
          node-version: "22"

      - name: Install dependencies & build
        run: bun install --frozen-lockfile && bun run build

      - name: Prepare isolated database and start copilot-api
        run: |
          set -euo pipefail
          SMOKE_GATEWAY_KEY=$(bun -e 'process.stdout.write(crypto.randomUUID() + crypto.randomUUID())')
          echo "::add-mask::$SMOKE_GATEWAY_KEY"
          echo "SMOKE_GATEWAY_KEY=$SMOKE_GATEWAY_KEY" >> "$GITHUB_ENV"
          export SMOKE_GATEWAY_KEY
          bun tests/smoke/prepare-database.ts
          bun run dist/main.js start --host 127.0.0.1 > tests/smoke/server.log 2>&1 &
          pid=$!
          echo "Waiting for database and model readiness..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4141/health/ready > /dev/null \
              && curl -sf -H "Authorization: Bearer $SMOKE_GATEWAY_KEY" http://localhost:4141/v1/models \
                | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin)["data"] else 1)'; then
              echo "Server is up (database and models ready)"
              exit 0
            fi
            kill -0 "$pid" || exit 1
            sleep 3
          done
          echo "::error::Smoke server failed readiness checks."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Install CLI tools
        run: |
          npm i -g @anthropic-ai/claude-code@latest
          npm i -g @openai/codex@latest
          npm i -g @google/gemini-cli@latest
          echo "--- Installed versions ---"
          claude --version
          codex --version
          gemini --version

      - name: Run smoke tests
        env:
          SMOKE_REQUIRE_CLIENTS: "1"
        run: |
          chmod +x tests/smoke/run-smoke-tests.sh
          tests/smoke/run-smoke-tests.sh http://localhost:4141

      - name: Print server logs
        if: always()
        run: |
          echo "=== copilot-api server logs ==="
          cat tests/smoke/server.log 2>/dev/null || echo "No server log found"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-test-logs
          path: tests/smoke/server.log
          retention-days: 7
          if-no-files-found: ignore
